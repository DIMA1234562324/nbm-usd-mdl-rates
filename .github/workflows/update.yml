name: Update NBM rates

on:
  schedule:
    - cron: "0 14 * * *"   # ~17:00 Chisinau (summer time)
    - cron: "0 18 * * *"   # backup run
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency: rates

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm (trusted publishing needs npm 11.5+)
        run: npm install -g npm@latest

      - name: Fetch rates from bnm.md
        run: node update.mjs

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.json rates.js package.json
          git diff --cached --quiet || (git commit -m "NBM rates $(date -u +%F)" && git push)

      - name: Publish to npm if version is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUB=$(npm view nbm-usd-mdl-rates version 2>/dev/null || echo none)
          echo "local=$LOCAL published=$PUB"
          if [ "$LOCAL" != "$PUB" ]; then
            npm publish --access public
            sleep 20
            curl -s "https://purge.jsdelivr.net/npm/nbm-usd-mdl-rates@1/rates.js" || true
          fi
